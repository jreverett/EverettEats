name: Build and Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: 10.0.x

    # Audit direct and transitive dependencies, failing on vulnerabilities or audit errors.
    - name: Restore and audit dependencies
      run: >-
        dotnet restore EverettEats.sln
        -p:NuGetAudit=true -p:NuGetAuditMode=all -p:NuGetAuditLevel=low
        -p:TreatWarningsAsErrors=true

    - name: Build
      run: dotnet build EverettEats.sln --configuration Release --no-restore -p:TreatWarningsAsErrors=true

    - name: Run tests
      run: dotnet test EverettEats.sln --configuration Release --no-build --no-restore --verbosity normal

    - name: Test browser-side import validation
      run: node --test EverettEats.UnitTests/kitchen.test.cjs

    - name: Publish and package
      run: |
        dotnet publish EverettEats.csproj --configuration Release --no-build --no-restore -o ./publish --self-contained false
        # Preserve executable permissions when transferring the published app between jobs.
        tar -czf "$RUNNER_TEMP/everetteats-publish.tar.gz" -C ./publish .

    - name: Upload deployment artifact
      if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: everetteats-publish
        path: ${{ runner.temp }}/everetteats-publish.tar.gz
        if-no-files-found: error
        retention-days: 1

  # Keep VPS credentials off the runner that restores, builds, and tests repository code.
  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: {}
    concurrency:
      group: everetteats-production
      cancel-in-progress: false

    steps:
    - name: Download deployment artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: everetteats-publish
        path: ${{ runner.temp }}
        digest-mismatch: error

    - name: Unpack published app
      run: |
        mkdir -p ./publish
        tar -xzf "$RUNNER_TEMP/everetteats-publish.tar.gz" -C ./publish

    - name: Deploy to VPS
      uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_PRIVATE_KEY }}
        source: "./publish/*"
        target: "/tmp/everetteats-deploy"
        rm: true

    - name: Update app on VPS
      uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_PRIVATE_KEY }}
        script: |
          set -e
          sudo systemctl stop everetteats
          sudo rm -rf /var/www/everetteats/*
          sudo mv /tmp/everetteats-deploy/publish/* /var/www/everetteats/
          sudo chown -R everetteats:everetteats /var/www/everetteats
          sudo systemctl start everetteats
          sudo rm -rf /tmp/everetteats-deploy
          sleep 3
          systemctl is-active --quiet everetteats
          app_pid="$(systemctl show --property MainPID --value everetteats)" || app_pid=0
          if [ "$app_pid" -gt 0 ] && [ -r "/proc/$app_pid/maps" ]; then
            runtime_versions="$(sed -nE 's#.*(/shared/(Microsoft.NETCore.App|Microsoft.AspNetCore.App)/[^/]+)/.*#\1#p' "/proc/$app_pid/maps" | sort -u)"
            if [ -n "$runtime_versions" ]; then
              printf 'Loaded shared framework versions:\n%s\n' "$runtime_versions"
            else
              echo "Loaded runtime versions unavailable; service is active."
            fi
          else
            echo "Loaded runtime inspection unavailable; service is active."
          fi
          echo "Deployment completed at $(date)"
